<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>我的第一个 Git 练习页</title>
  <style>
    body { font-family: system-ui, "Microsoft YaHei", sans-serif; max-width: 640px; margin: 60px auto; line-height: 1.8; }
    h1 { color: #0969da; }
    code { background: #f6f8fa; padding: 2px 6px; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>Hello, GitHub 👋</h1>
  <p>这个文件是练习仓库的一部分，每次提交都会留下一次历史。</p>
  <p>试着用你喜欢的编辑器改一行文字，然后运行 <code>git diff</code> 看看 git 是怎么记录改动的。</p>
  <p>这一行是在 <code>feature-editor</code> 分支上加的 —— 合并之前，main 分支看不到它。</p>
</body>
